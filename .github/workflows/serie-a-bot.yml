name: Serie A Bot

on:
  schedule:
    - cron: "0 14 * * *"
    - cron: "0 17 * * *"
    - cron: "0 20 * * *"
    - cron: "30 22 * * *"

  workflow_dispatch:
    inputs:
      test_telegram:
        description: "Invia un messaggio Telegram di prova"
        required: false
        default: false
        type: boolean

      test_last_match:
        description: "Invia l'ultima partita Serie A finita"
        required: false
        default: false
        type: boolean

jobs:
  run-bot:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Test Telegram
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_telegram == true }}
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -c 'from serie_a_bot import send_telegram_message; send_telegram_message("✅ Serie A Bot collegato correttamente!")'

      - name: Esegui il bot
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.test_telegram != true }}
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST_LAST_FINISHED: ${{ inputs.test_last_match }}
        run: python serie_a_bot.py

      - name: Salva le partite già notificate
        if: ${{ github.event_name != 'workflow_dispatch' || (inputs.test_telegram != true && inputs.test_last_match != true) }}
        run: |
          git config user.name "serie-a-bot"
          git config user.email "actions@users.noreply.github.com"
          git add notified.json
          git diff --staged --quiet || git commit -m "Aggiorna partite notificate"
          git push
